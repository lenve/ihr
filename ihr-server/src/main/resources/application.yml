server:
  port: 8090

spring:
  application:
    name: ihr-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:13306/ihr?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
  data:
    redis:
      host: localhost
      port: 16379
      password: redis123
      timeout: 5s
  rabbitmq:
    host: localhost
    port: 56772
    username: ihr
    password: rabbit123

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

# JWT 配置（框架阶段假数据登录，接入真实业务后替换）
jwt:
  # HS256 密钥，至少 32 字节；生产环境请从配置中心/环境变量注入
  secret: ihr-jwt-secret-key-please-change-in-production-0123456789
  # token 有效期（毫秒），默认 8 小时
  expire: 28800000
  header: Authorization
  prefix: "Bearer "

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ihr: info
